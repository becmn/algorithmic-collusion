<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preços algorítmicos · simulador de Q-learning</title>
  <meta name="description" content="Simulador no navegador: dois algoritmos de preço que nunca se comunicaram aprendem a cobrar acima do preço competitivo (duopólio de Calvano et al., 2020).">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/newsreader-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=20261030b">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Dois algoritmos de preço que nunca se comunicaram aprenderam a cobrar acima do preço competitivo">
  <meta property="og:description" content="Simulador no navegador do duopólio de Calvano et al. (2020), em português e inglês: aprendizado ao vivo, teste do desvio e comparação com algoritmos sem memória.">
  <meta property="og:url" content="https://becmn.github.io/algorithmic-collusion/">
  <meta property="og:image" content="https://becmn.github.io/algorithmic-collusion/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Simulador do Projeto B (Fase 2.2, direção visual A "Caderno de economia").
       Textos em js/i18n.js; desenho e controles em js/app.js. -->
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip_link">Pular para o conteúdo</a>

  <!-- Bloco 1: barra superior -->
  <header class="topbar">
    <div class="wrap topbar-inner">
      <span class="site-name" data-i18n="site_name">Preços algorítmicos</span>
      <nav class="topnav">
        <a href="#deviation" data-i18n="nav_deviation">Teste do desvio</a>
        <a href="#results" data-i18n="nav_results">Resultados</a>
        <a href="#method" data-i18n="nav_method">Método</a>
        <a href="https://github.com/becmn/algorithmic-collusion" rel="noopener" data-i18n="nav_code">Código</a>
        <button type="button" id="lang-btn" class="lang-btn" data-i18n-attr="aria-label:lang_switch_aria">
          <span id="lang-btn-text" class="lang-long" data-i18n="lang_switch_text">English</span>
          <span class="lang-short" aria-hidden="true" data-i18n="lang_switch_short">EN</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    <!-- Bloco 2: resultado -->
    <section class="grid hero" aria-labelledby="title">
      <div class="col-main-wide">
        <p class="kicker" data-i18n="kicker"></p>
        <h1 id="title" data-i18n="title"></h1>
        <p class="dek" data-i18n="dek"></p>
      </div>
      <aside class="col-side byline">
        <p><strong data-i18n="author_name"></strong><br><span data-i18n="author_affil"></span></p>
        <p id="author-updated"></p>
      </aside>
    </section>

    <section class="grid rule-top hero-data" aria-labelledby="learn-title">
      <div class="col-main">
        <div class="mem-switch" role="group" aria-labelledby="mem-label">
          <span id="mem-label" class="mem-label" data-i18n="mem_switch_label"></span>
          <button type="button" id="mem-with" class="seg" aria-pressed="true" data-i18n="mem_with"></button>
          <button type="button" id="mem-without" class="seg" aria-pressed="false" data-i18n="mem_without"></button>
        </div>
        <p class="note mem-note" id="mem-note" hidden data-i18n="mem_note"></p>
        <figure class="figure">
          <figcaption class="figcap">
            <strong data-i18n="fig_1"></strong> <span id="learn-title" data-i18n="chart_learning_title"></span>
            <span class="badge" id="badge"></span>
          </figcaption>
          <div class="legend" aria-hidden="true">
            <span class="lg"><span class="key key-a"></span> <span data-i18n="firm_a"></span></span>
            <span class="lg"><span class="key key-b"></span> <span data-i18n="firm_b"></span></span>
          </div>
          <div id="learn-chart" class="chart" role="img" aria-labelledby="learn-title" aria-describedby="learn-desc"></div>
          <p id="learn-desc" class="visually-hidden" data-i18n="chart_learning_desc"></p>
          <p class="note"><span data-i18n="subtitle"></span> <span data-i18n="chart_learning_note"></span> <span data-i18n="chart_hint"></span></p>
          <details class="data-table">
            <summary data-i18n="data_table_summary"></summary>
            <div id="learn-table" class="table-scroll"></div>
          </details>
        </figure>
        <div class="controls" role="group" data-i18n-attr="aria-label:controls_label">
          <button type="button" id="btn-run" class="btn btn-primary"></button>
          <button type="button" id="btn-deviate" class="btn" aria-describedby="deviate-hint"></button>
          <button type="button" id="btn-new" class="btn btn-link"></button>
          <span id="deviate-hint" class="hint"></span>
        </div>
      </div>

      <aside class="col-side side" aria-label="Δ">
        <p class="delta-label" data-i18n="delta_label"></p>
        <p class="delta-value"><output id="delta-value" aria-live="off">–</output></p>
        <p class="delta-when" id="delta-when"></p>
        <p class="delta-mean" id="delta-mean"></p>
        <div class="meter" aria-hidden="true"><div class="meter-mean" id="meter-mean"></div><div class="meter-fill" id="meter-fill"></div></div>
        <p class="delta-scale" data-i18n="delta_scale"></p>
        <p class="source" id="source-line"></p>
        <p class="status" id="status" role="status" aria-live="polite"></p>
        <p class="outcome" id="outcome"></p>
        <p class="aggregate" id="aggregate"></p>
      </aside>
    </section>

    <!-- Bloco 3: teste do desvio -->
    <section id="deviation" class="grid rule-top block" aria-labelledby="dev-h2" tabindex="-1">
      <div class="col-main">
        <h2 id="dev-h2" data-i18n="dev_h2"></h2>
        <p data-i18n="dev_intro"></p>
        <p class="note" id="dev-cycle-note" hidden data-i18n="dev_cycle_note"></p>
        <p class="note mem-note" id="dev-mem-note" hidden data-i18n="dev_mem_note"></p>
        <figure class="figure">
          <figcaption class="figcap"><strong data-i18n="fig_2"></strong> <span id="dev-title" data-i18n="chart_dev_title"></span></figcaption>
          <div class="legend" aria-hidden="true">
            <span class="lg"><span class="key key-a"></span> <span data-i18n="firm_a"></span></span>
            <span class="lg"><span class="key key-b"></span> <span data-i18n="firm_b"></span></span>
            <span class="lg"><span class="key key-ctrl"></span> <span data-i18n="line_control"></span></span>
          </div>
          <div id="dev-chart" class="chart" role="img" aria-labelledby="dev-title" aria-describedby="dev-desc"></div>
          <p id="dev-desc" class="visually-hidden" data-i18n="chart_dev_desc"></p>
          <details class="data-table">
            <summary data-i18n="data_table_summary"></summary>
            <div id="dev-table" class="table-scroll"></div>
          </details>
        </figure>
        <p class="verdict" id="verdict" aria-live="polite"></p>
        <p id="dev-aggregate"></p>
        <p class="caveat" id="dev-caveat"></p>
      </div>
      <aside class="col-side side">
        <dl class="scoreboard">
          <div><dt data-i18n="score_react"></dt><dd id="score-react">–</dd></div>
          <div><dt data-i18n="score_back"></dt><dd id="score-back">–</dd></div>
          <div><dt data-i18n="score_profit"></dt><dd id="score-profit">–</dd></div>
        </dl>
      </aside>
    </section>

    <section class="grid rule-top block" aria-labelledby="sep-h2">
      <div class="col-main">
        <h2 id="sep-h2" data-i18n="sep_h3"></h2>
        <p data-i18n="sep_predict"></p>
        <figure class="figure">
          <figcaption class="figcap"><strong data-i18n="fig_3"></strong> <span id="sep-main-title" data-i18n="sep_main_title"></span></figcaption>
          <div id="sep-main" class="chart" role="img" aria-labelledby="sep-main-title" aria-describedby="sep-main-desc"></div>
          <p id="sep-main-desc" class="visually-hidden"></p>
        </figure>
        <p class="sep-result" id="sep-result"></p>
        <details class="more" id="sep-more">
          <summary id="sep-more-summary"></summary>
          <p class="note" data-i18n="sep_note"></p>
          <figure class="figure">
            <figcaption class="figcap"><span id="sep-title" data-i18n="chart_sep_title"></span></figcaption>
            <div class="legend" aria-hidden="true">
              <span class="lg"><span class="key key-dot-with"></span> <span data-i18n="sep_with"></span></span>
              <span class="lg"><span class="key key-dot-without"></span> <span data-i18n="sep_without"></span></span>
            </div>
            <div id="sep-chart" class="chart" role="img" aria-labelledby="sep-title" aria-describedby="sep-desc"></div>
            <p id="sep-desc" class="visually-hidden" data-i18n="chart_sep_desc"></p>
            <div id="sep-table" class="table-scroll"></div>
          </figure>
        </details>
      </div>
      <aside class="col-side side">
        <p class="pullquote" data-i18n="sep_conclusion"></p>
        <p class="note" data-i18n="sep_rule_note"></p>
      </aside>
    </section>

    <!-- Resultados principais × artigo original -->
    <section id="results" class="grid rule-top block" aria-labelledby="tab1-h2" tabindex="-1">
      <div class="col-main">
        <h2 id="tab1-h2" data-i18n="tab1_h2"></h2>
        <div class="table-scroll"><table class="results" id="tab1"></table></div>
      </div>
      <aside class="col-side side">
        <p class="note" id="tab1-note"></p>
      </aside>
    </section>

    <!-- Bloco 6: por que isso importa -->
    <section class="grid rule-top block" aria-labelledby="why-h2">
      <div class="col-main">
        <h2 id="why-h2" data-i18n="why_h2"></h2>
        <p data-i18n="why_p1"></p>
        <p data-i18n="why_p2"></p>
        <div class="table-scroll">
          <table class="compare">
            <caption data-i18n="why_table_caption"></caption>
            <thead>
              <tr><td></td><th scope="col" data-i18n="why_col_tacit"></th><th scope="col" data-i18n="why_col_hub"></th></tr>
            </thead>
            <tbody>
              <tr><th scope="row" data-i18n="why_row_how"></th><td data-i18n="why_how_tacit" data-i18n-attr="data-label:why_col_tacit"></td><td data-i18n="why_how_hub" data-i18n-attr="data-label:why_col_hub"></td></tr>
              <tr><th scope="row" data-i18n="why_row_info"></th><td data-i18n="why_info_tacit" data-i18n-attr="data-label:why_col_tacit"></td><td data-i18n="why_info_hub" data-i18n-attr="data-label:why_col_hub"></td></tr>
              <tr><th scope="row" data-i18n="why_row_examples"></th><td data-i18n="why_examples_tacit" data-i18n-attr="data-label:why_col_tacit"></td><td data-i18n="why_examples_hub" data-i18n-attr="data-label:why_col_hub"></td></tr>
            </tbody>
          </table>
        </div>
        <p data-i18n-html="why_aprix"></p>
        <p data-i18n-html="why_realpage"></p>
      </div>
      <aside class="col-side side">
        <p class="pullquote small" data-i18n="why_not"></p>
      </aside>
    </section>

    <!-- Sobre o projeto -->
    <section class="grid rule-top block" aria-labelledby="about-h2">
      <h2 id="about-h2" class="col-side-left" data-i18n="about_h2"></h2>
      <div class="col-rest">
        <p data-i18n="about_p1"></p>
        <p data-i18n="about_p2"></p>
        <p class="note" data-i18n="about_stack"></p>
      </div>
    </section>

    <!-- Bloco 7: método -->
    <section id="method" class="grid rule-top block" aria-labelledby="method-h2" tabindex="-1">
      <h2 id="method-h2" class="col-side-left" data-i18n="method_h2"></h2>
      <div class="col-rest">
        <details class="method">
          <summary data-i18n="method_open"></summary>
          <p data-i18n="method_model"></p>
          <div class="table-scroll"><table class="params" id="params-table"></table></div>
          <p id="method-measure"></p>
          <p data-i18n="method_engine"></p>
          <h3 data-i18n="lim_h3"></h3>
          <ul>
            <li data-i18n="lim_1"></li>
            <li data-i18n="lim_2"></li>
            <li id="lim-3"></li>
            <li data-i18n="lim_4"></li>
            <li data-i18n="lim_5"></li>
            <li data-i18n="lim_6"></li>
          </ul>
          <h3 data-i18n="data_h3"></h3>
          <ul>
            <li><a href="data/qlearning_params.json" data-i18n="data_params"></a></li>
            <li><a href="data/qlearning_reference.json" data-i18n="data_reference"></a></li>
            <li><a href="data/qlearning_sessions.json" data-i18n="data_sessions"></a></li>
            <li><a href="data/qlearning_memoryless.json" data-i18n="data_memoryless"></a></li>
            <li><a href="https://github.com/becmn/algorithmic-collusion" rel="noopener" data-i18n="data_repo"></a></li>
          </ul>
          <h3 data-i18n="cite_h3"></h3>
          <p class="cite" id="cite-text"></p>
          <p class="cite" data-i18n="cite_original"></p>
        </details>
        <p class="note" id="updated"></p>
      </div>
    </section>
  </main>

  <!-- Bloco 8: rodapé -->
  <footer class="footer">
    <div class="wrap">
      <p><span data-i18n="footer_author"></span> <span data-i18n="footer_license"></span></p>
      <p data-i18n="footer_credits"></p>
      <p><span data-i18n="footer_no_ai"></span> <span data-i18n="footer_fonts"></span></p>
    </div>
  </footer>

  <!-- ?v=… muda a cada versão: força o navegador a baixar os arquivos novos (sem isso, o
       GitHub Pages deixa o navegador usar a cópia antiga por até 10 minutos) -->
  <script src="js/i18n.js?v=20261030b"></script>
  <script src="js/engine.js?v=20261030b"></script>
  <script src="js/deviation.js?v=20261030b"></script>
  <script src="js/app.js?v=20261030b"></script>
</body>
</html>
